<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Biblioteca — Catálogo, préstamos y reservas</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO -->
  <meta name="description" content="Sistema de biblioteca en línea: explora el catálogo de libros, gestiona tus préstamos y reserva ejemplares disponibles.">
  <meta name="author" content="Biblioteca">
  <meta name="theme-color" content="#0a2b5d">
  <link rel="canonical" href="/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Biblioteca">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Biblioteca — Catálogo, préstamos y reservas">

  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Logotipo de Biblioteca: un libro abierto con tres libros de colores.">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Biblioteca — Catálogo, préstamos y reservas">

  <meta name="twitter:image" content="/og-image.png">

  <link rel="icon" href="favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="manifest" href="site.webmanifest">
