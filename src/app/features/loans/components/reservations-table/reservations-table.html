<app-data-table
  [value]="reservations()"
  [columns]="columns"
  [loading]="loading()"
  [globalFilterFields]="['bookTitle', 'bookIsbn']"
  [selectFilter]="statusFilter"
  searchPlaceholder="Buscar por libro o ISBN..."
  emptyMessage="No tienes reservas."
>
  <ng-template appColumnTemplate="requestDate" let-reservation>
    {{ reservation.requestDate | date: 'short' }}
  </ng-template>

  <ng-template appColumnTemplate="status" let-reservation>
    <p-tag [value]="reservation.status" />
  </ng-template>

  <ng-template appColumnTemplate="actions" let-reservation>
    @if (reservation.status === 'PENDIENTE' || reservation.status === 'NOTIFICADO') {
      <app-button label="Cancelar" (click)="cancelReservation.emit(reservation)" class="text-sm" />
    }
  </ng-template>
</app-data-table>
