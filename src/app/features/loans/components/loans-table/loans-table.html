<app-data-table
  [value]="loans()"
  [columns]="columns"
  [loading]="loading()"
  [globalFilterFields]="['bookTitle', 'bookIsbn']"
  searchPlaceholder="Buscar por libro o ISBN..."
  emptyMessage="Todavía no tienes préstamos."
>
  <ng-template appColumnTemplate="estado" let-loan>
    <app-overdue-badge [returned]="loan.returnDate !== null" [overdue]="loan.overdue" />
    @if (loan.reminderSent && !loan.returnDate) {
      <span class="ml-2 text-xs text-surface-500" title="Ya se envió un recordatorio por correo">✉️ recordatorio enviado</span>
    }
  </ng-template>

  <ng-template appColumnTemplate="actions" let-loan>
    @if (!loan.returnDate) {
      <app-button label="Devolver" (click)="returnLoan.emit(loan)" class="text-sm" />
    }
  </ng-template>
</app-data-table>
