<p-table [value]="users()" dataKey="id" [rowTrackBy]="trackById" styleClass="w-full">
  <ng-template pTemplate="header">
    <tr>
      <th>Nombre</th>
      <th>Correo</th>
      <th>Bloqueada hasta</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.name }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.blockedUntil | date: 'short' }}</td>
      <td>
        <app-button label="Desbloquear" (click)="unblock.emit(user)" class="text-sm" />
      </td>
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="4" class="text-center text-surface-500 py-6">No hay cuentas bloqueadas.</td>
    </tr>
  </ng-template>
</p-table>
