<app-data-table
  [value]="logs()"
  [columns]="columns"
  [globalFilterFields]="['message', 'exceptionType', 'path']"
  [selectFilter]="levelFilter"
  searchPlaceholder="Buscar por mensaje, excepción o ruta..."
  emptyMessage="No hay errores registrados."
>
  <ng-template appColumnTemplate="level" let-entry>
    <p-tag [value]="entry.level" [severity]="severityFor(entry.level)" />
  </ng-template>

  <ng-template appColumnTemplate="path" let-entry>
    <span class="text-xs text-surface-500">{{ entry.httpMethod }} {{ entry.path }}</span>
  </ng-template>

  <ng-template appColumnTemplate="createdAt" let-entry>
    {{ entry.createdAt | date: 'short' }}
  </ng-template>
</app-data-table>
