<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-wrap items-end gap-3 mb-4">
  <div class="flex flex-col gap-1">
    <label for="search-title" class="text-xs font-medium text-surface-600 dark:text-surface-300">Título</label>
    <app-text-input id="search-title" placeholder="Buscar por título" formControlName="title" />
  </div>

  <div class="flex flex-col gap-1">
    <label for="search-author" class="text-xs font-medium text-surface-600 dark:text-surface-300">Autor</label>
    <app-text-input id="search-author" placeholder="Buscar por autor" formControlName="author" />
  </div>

  <div class="flex flex-col gap-1">
    <label for="search-status" class="text-xs font-medium text-surface-600 dark:text-surface-300">Estado</label>
    <p-select
      id="search-status"
      formControlName="status"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Todos los estados"
      [showClear]="true"
    />
  </div>

  <app-button label="Buscar" type="submit" />
</form>
