<p-table [value]="books()" [loading]="loading()" dataKey="id" [rowTrackBy]="trackById" styleClass="w-full">
  <ng-template pTemplate="header">
    <tr>
      <th>Título</th>
      <th>Autor</th>
      <th>ISBN</th>
      <th>Año</th>
      <th>Estado</th>
      @if (canManage()) {
        <th>Acciones</th>
      }
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-book>
    <tr>
      <td>{{ book.title }}</td>
      <td>{{ book.author }}</td>
      <td>{{ book.isbn }}</td>
      <td>{{ book.publicationYear ?? '—' }}</td>
      <td><app-status-badge [status]="book.status" /></td>
      @if (canManage()) {
        <td>
          @if (book.status === 'DISPONIBLE') {
            <app-button label="Eliminar" (click)="deleteBook.emit(book)" class="text-sm" />
          }
        </td>
      }
    </tr>
  </ng-template>

  <ng-template pTemplate="emptymessage">
    <tr>
      <td [attr.colspan]="canManage() ? 6 : 5" class="text-center text-surface-500 py-6">
        No hay libros que coincidan con la búsqueda.
      </td>
    </tr>
  </ng-template>
</p-table>
