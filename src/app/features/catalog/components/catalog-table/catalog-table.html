<app-data-table
  [value]="books()"
  [columns]="columns"
  [loading]="loading()"
  [globalFilterFields]="['title', 'author', 'isbn']"
  [selectFilter]="statusFilter"
  searchPlaceholder="Buscar por título, autor o ISBN..."
  emptyMessage="No hay libros que coincidan con la búsqueda."
>
  <ng-template appColumnTemplate="status" let-book>
    <app-status-badge [status]="book.status" />
  </ng-template>

  <ng-template appColumnTemplate="actions" let-book>
    <div class="flex gap-2 flex-wrap">
      @if (book.status === 'DISPONIBLE') {
        <app-button label="Pedir préstamo" (click)="borrowBook.emit(book)" class="text-sm" />
      }
      @if (book.status === 'PRESTADO') {
        <app-button label="Reservar" (click)="reserveBook.emit(book)" class="text-sm" />
      }
      @if (canManage() && book.status === 'DISPONIBLE') {
        <app-button label="Eliminar" (click)="deleteBook.emit(book)" class="text-sm" />
      }
    </div>
  </ng-template>
</app-data-table>
