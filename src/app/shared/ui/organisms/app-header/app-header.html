<header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 bg-white dark:bg-surface-900 shadow-sm px-4 sm:px-6 py-3 sm:py-4 border-b border-surface-200 dark:border-surface-700">
  <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-6">
    <div class="flex items-center gap-2">
      @if (!logoBroken()) {
        <img src="img/logo.png" alt="" class="h-8 w-8 rounded object-contain" (error)="logoBroken.set(true)" />
      }
      <h1 class="text-lg font-semibold text-surface-900 dark:text-surface-0">Biblioteca</h1>
    </div>

    @if (currentUser()) {
      <nav class="flex items-center gap-3 sm:gap-4 text-sm flex-wrap">
        <a routerLink="/" routerLinkActive="font-semibold text-primary-600" [routerLinkActiveOptions]="{ exact: true }"
           class="text-surface-600 dark:text-surface-300 hover:text-primary-600">
          Catálogo
        </a>
        <a routerLink="/mis-prestamos" routerLinkActive="font-semibold text-primary-600"
           class="text-surface-600 dark:text-surface-300 hover:text-primary-600">
          Mis préstamos
        </a>
        @if (currentUser()?.role === 'ADMIN') {
          <a routerLink="/admin" routerLinkActive="font-semibold text-primary-600"
             class="text-surface-600 dark:text-surface-300 hover:text-primary-600">
            Administración
          </a>
        }
      </nav>
    }
  </div>

  <div class="flex items-center justify-between sm:justify-end gap-3">
    <app-button
      [label]="theme.isDark() ? '☀️' : '🌙'"
      [attr.aria-label]="theme.isDark() ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
      (click)="theme.toggle()"
      class="shrink-0"
    />

    @if (currentUser(); as user) {
      <p-avatar
        [label]="initials()"
        shape="circle"
        styleClass="cursor-pointer bg-primary-600! text-white!"
        (click)="userMenu.toggle($event)"
        [attr.aria-label]="user.name + ' · ' + user.role"
      />
      <p-menu #userMenu [model]="userMenuItems()" [popup]="true" />
    }
  </div>
</header>
