server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae en index.html para que el
    # router de Angular la resuelva en el cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend en producción habla con /api (ver environment.ts); nginx reenvía al
    # backend dentro de la red de Docker Compose, evitando problemas de CORS.
    #
    # "backend" se resuelve vía el DNS embebido de Docker (127.0.0.11) usando una
    # variable en proxy_pass en vez de un upstream fijo: así nginx re-resuelve el
    # nombre en cada request (cache de 10s) en lugar de solo al arrancar. Con un
    # upstream estático, si este contenedor arranca antes que el backend (o el
    # backend se reinicia y cambia de IP), nginx directamente rehúsa levantar.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend_upstream http://backend:8080;
        # $request_uri (no $uri): la URI original completa tal como llegó del cliente,
        # sin normalizar. Con una variable en proxy_pass, nginx NO hace el
        # location-prefix-stripping automático que sí hace con una cadena fija — un sufijo
        # fijo aquí (p. ej. "/api/") se usaría literal para TODAS las requests, perdiendo
        # el resto de la ruta real (bug real, encontrado probando de verdad).
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(?:css|js|map|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }

    # mime.types de nginx no trae .webmanifest
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        access_log off;
    }
}
